[package]
name = "backend"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
